[defaults]
inventory = inventory.yml
host_key_checking = False
# YAML-formatted output via the built-in default callback. (The old
# `stdout_callback = yaml` from community.general was removed in newer
# community.general; this is the portable, forward-compatible replacement.)
result_format = yaml
callbacks_enabled = profile_tasks
retry_files_enabled = False
gathering = smart

[ssh_connection]
pipelining = True
