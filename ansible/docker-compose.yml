services:
  testbox:
    build:
      context: .
      dockerfile: Dockerfile.testbox
    image: dotfiles-testbox
    container_name: dotfiles-testbox
    ports:
      - "2222:22"
    volumes:
      - ..:/dotfiles:ro
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "sshd", "-t"]
      interval: 5s
      timeout: 3s
      retries: 10
