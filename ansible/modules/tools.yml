---
# CLI tools: eza, fzf, zoxide, ripgrep, tldr, gh, lazygit.
# Config (lazygit, etc.) is stow-managed — nothing here syncs it.
- name: Install CLI tools (macOS)
  community.general.homebrew:
    name: [eza, fzf, zoxide, ripgrep, tldr, gh, lazygit]
    state: present
  when: ansible_system == "Darwin"

- name: Install CLI tools from apt (Linux)
  apt:
    name: [ripgrep, fzf, tldr]
    state: present
  become: true
  when: ansible_os_family == "Debian"

- name: Install tools not in apt (Linux)
  when: ansible_os_family == "Debian"
  block:
    - name: Set release arch facts
      set_fact:
        # eza/zoxide use the GNU triple (aarch64); lazygit uses arm64.
        gnu_arch: "{{ 'aarch64' if ansible_facts.architecture == 'aarch64' else 'x86_64' }}"
        lazygit_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'x86_64' }}"

    - name: Download eza
      get_url:
        url: "https://github.com/eza-community/eza/releases/latest/download/eza_{{ gnu_arch }}-unknown-linux-gnu.tar.gz"
        dest: /tmp/eza.tar.gz
        mode: "0644"

    - name: Install eza
      unarchive:
        src: /tmp/eza.tar.gz
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/eza
      become: true

    - name: Get latest zoxide version
      uri:
        url: https://api.github.com/repos/ajeetdsouza/zoxide/releases/latest
        return_content: true
      register: zoxide_release

    - name: Download zoxide
      get_url:
        url: "https://github.com/ajeetdsouza/zoxide/releases/latest/download/zoxide-{{ zoxide_release.json.tag_name[1:] }}-{{ gnu_arch }}-unknown-linux-musl.tar.gz"
        dest: /tmp/zoxide.tar.gz
        mode: "0644"

    - name: Install zoxide
      unarchive:
        src: /tmp/zoxide.tar.gz
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/zoxide
      become: true

    - name: Get latest lazygit version
      uri:
        url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
        return_content: true
      register: lazygit_release

    - name: Download lazygit
      get_url:
        url: "https://github.com/jesseduffield/lazygit/releases/latest/download/lazygit_{{ lazygit_release.json.tag_name[1:] }}_Linux_{{ lazygit_arch }}.tar.gz"
        dest: /tmp/lazygit.tar.gz
        mode: "0644"

    - name: Install lazygit
      unarchive:
        src: /tmp/lazygit.tar.gz
        dest: /usr/local/bin
        remote_src: true
        creates: /usr/local/bin/lazygit
      become: true

    - name: Install gh via its apt repo (keyring, no gpg needed)
      become: true
      block:
        - name: Ensure apt keyrings dir exists
          file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download GitHub CLI keyring (already dearmored)
          get_url:
            url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
            dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
            mode: "0644"

        - name: Add GitHub CLI repository
          apt_repository:
            repo: "deb [arch={{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
            filename: github-cli
            state: present

        - name: Install gh
          apt:
            name: gh
            state: present
            update_cache: true
