---
- name: Install nvm
  tags: [dev, node]
  git:
    repo: https://github.com/nvm-sh/nvm.git
    dest: "{{ ansible_env.HOME }}/.nvm"
    depth: 1

- name: Install pyenv (macOS)
  tags: [dev, python]
  community.general.homebrew:
    name: pyenv
    state: present
  when: ansible_system == "Darwin"

- name: Install pyenv (Linux)
  tags: [dev, python]
  block:
    - name: Install pyenv build dependencies
      apt:
        name:
          - make
          - build-essential
          - libssl-dev
          - zlib1g-dev
          - libbz2-dev
          - libreadline-dev
          - libsqlite3-dev
          - wget
          - curl
          - llvm
          - libncursesw5-dev
          - xz-utils
          - tk-dev
          - libxml2-dev
          - libxmlsec1-dev
          - libffi-dev
          - liblzma-dev
        state: present
      become: true

    - name: Install pyenv
      git:
        repo: https://github.com/pyenv/pyenv.git
        dest: "{{ ansible_env.HOME }}/.pyenv"
        depth: 1
  when: ansible_os_family == "Debian"

- name: Install Go (macOS)
  tags: [dev, go]
  community.general.homebrew:
    name: go
    state: present
  when: ansible_system == "Darwin"

- name: Install Go (Linux)
  tags: [dev, go]
  block:
    - name: Download Go
      get_url:
        url: https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
        dest: /tmp/go.tar.gz

    - name: Extract Go
      unarchive:
        src: /tmp/go.tar.gz
        dest: /usr/local
        remote_src: true
        creates: /usr/local/go
      become: true
  when: ansible_os_family == "Debian"

- name: Install sdkman
  tags: [dev, java]
  block:
    - name: Download sdkman installer
      get_url:
        url: https://get.sdkman.io
        dest: /tmp/sdkman-install.sh
        mode: "0755"

    - name: Install sdkman
      command: /tmp/sdkman-install.sh
      args:
        creates: "{{ ansible_env.HOME }}/.sdkman"
      environment:
        SDKMAN_DIR: "{{ ansible_env.HOME }}/.sdkman"

- name: Install Docker (macOS)
  tags: [dev, docker]
  community.general.homebrew:
    name: docker
    state: present
  when: ansible_system == "Darwin"

- name: Install Docker (Linux)
  tags: [dev, docker]
  when: ansible_os_family == "Debian"
  block:
    - name: Install Docker dependencies
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present
      become: true

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker packages
      apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present

    - name: Add user to docker group
      user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: true

- name: Install colima (macOS, Docker runtime)
  tags: [dev, docker]
  community.general.homebrew:
    name: colima
    state: present
  when: ansible_system == "Darwin"

- name: Install Aerospace (macOS only)
  tags: [dev, aerospace]
  community.general.homebrew:
    name: nikitabobko/tap/aerospace
    state: present
    casks: true
  when: ansible_system == "Darwin"

- name: Sync aerospace config
  tags: [dev, aerospace]
  synchronize:
    src: "{{ dotfiles_dir }}/.config/aerospace/"
    dest: "{{ ansible_env.HOME }}/.config/aerospace/"
    delete: true
  when: ansible_system == "Darwin"
