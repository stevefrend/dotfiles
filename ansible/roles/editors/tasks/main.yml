---
- name: Install neovim (macOS)
  community.general.homebrew:
    name: neovim
    state: present
  when: ansible_system == "Darwin"

- name: Install neovim (Linux)
  block:
    - name: Install neovim dependencies
      apt:
        name: [curl, ripgrep, xsel]
        state: present
      become: true

    - name: Check if neovim is installed
      stat:
        path: /opt/nvim-linux64/bin/nvim
      register: nvim_installed

    - name: Download neovim release
      unarchive:
        src: "https://github.com/neovim/neovim/releases/latest/download/nvim-linux-{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'x86_64' }}.tar.gz"
        dest: /opt
        remote_src: true
      become: true
      when: not nvim_installed.stat.exists

    - name: Symlink nvim to PATH
      file:
        src: "/opt/nvim-linux-{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'x86_64' }}/bin/nvim"
        dest: /usr/local/bin/nvim
        state: link
      become: true
      when: not nvim_installed.stat.exists
  when: ansible_os_family == "Debian"

- name: Ensure .config/nvim exists
  file:
    path: "{{ ansible_env.HOME }}/.config/nvim"
    state: directory
    mode: "0755"

- name: Sync nvim config from dotfiles repo
  synchronize:
    src: "{{ dotfiles_dir }}/.config/nvim/"
    dest: "{{ ansible_env.HOME }}/.config/nvim/"
    delete: true
  when: dotfiles_dir != ansible_env.HOME + "/dotfiles"
